<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルな家計簿</title>
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>

<body>
  <header>
    <h1>家計簿アプリ</h1>
    <h2>家計簿をつけましょう</h2>
  </header>

  <main class="dashboard">
    <section class="card entry-card" aria-labelledby="entry-heading">
      <h2 id="entry-heading">家計簿記録の登録</h2>
      <form id="entry-form">
        <p>
          <label for="date">日付</label>
          <input type="date" id="date" name="date" required>
        </p>
        <p>
          <label for="item">品目</label>
          <input type="text" id="item" name="item" required>
        </p>
        <p>
          <label for="type">選択区分</label>
          <select id="type" name="type" required>
            <option value="expense">支出</option>
            <option value="income">収入</option>
          </select>
        </p>
        <p>
          <label for="amount">金額（円）</label>
          <input type="number" id="amount" name="amount" min="1" step="1" required>
        </p>
        <button type="submit">登録</button>
      </form>
    </section>

    <div class="overview">
      <section class="card total-card" aria-labelledby="total-heading">
        <h2 id="total-heading">合計金額</h2>
        <p id="total-amount">0円</p>
      </section>

      <section class="card records-card" aria-labelledby="list-heading">
        <h2 id="list-heading">収支一覧</h2>
        <ul id="records-list"></ul>
      </section>
    </div>
    <p id="app-status" class="app-status" role="status" aria-live="polite"></p>
  </main>
</body>

</html>
